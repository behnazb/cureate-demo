<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Not found · Cureate Connect</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      :root { --teal: #28ba93; --dark: #1f1f1f; --beige: #f7f5ef; --muted: #777; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--beige); color: var(--dark);
        font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 24px; text-align: center;
      }
      .card { max-width: 420px; }
      .badge {
        width: 64px; height: 64px; border-radius: 9999px; background: var(--teal);
        display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
        color: #fff; font-size: 28px; font-weight: 900;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0 0 24px; }
      a {
        display: inline-block; height: 44px; line-height: 44px; padding: 0 24px;
        border-radius: 9999px; background: var(--teal); color: #fff;
        font-size: 14px; font-weight: 700; text-decoration: none;
      }
      a:hover { background: #22a882; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">?</div>
      <h1>We couldn't find that page</h1>
      <p>The page or purchase order you're looking for doesn't exist or may have moved.</p>
      <a href="/products">Back to products</a>
    </main>
  </body>
</html>
